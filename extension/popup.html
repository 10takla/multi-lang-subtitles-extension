<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Субтитры к видео</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <svg class="header-icon" viewBox="0 0 24 24">
          <path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1zm7 0h-1.5v-.5h-2v3h2V13H18v1c0 .55-.45 1-1 1h-3c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1z"/>
        </svg>
        <span class="header-title">Субтитры</span>
        <span class="badge" id="line-count">0</span>
      </div>
      <div class="header-right">
        <button class="btn-icon" id="btn-toggle-widget" title="Показать/скрыть виджет на странице">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-4-4h2v2h-2v-2zm-8 0h6v2H7v-2zm8-4h2v2h-2v-2zm-8 0h6v2H7v-2zm8-4h2v2h-2V7zm-8 0h6v2H7V7z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Status Bar -->
    <div class="status-bar">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-text" id="status-text">Сканирование видео...</span>
      <span class="status-time" id="status-time"></span>
    </div>

    <!-- Search & Controls -->
    <div class="toolbar">
      <div class="search-box">
        <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="search-input" placeholder="Поиск по строкам..." />
      </div>
      <button class="btn-icon active" id="btn-autoscroll" title="Автопрокрутка">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M11 4v12.17l-5.59-5.59L4 12l8 8 8-8-1.41-1.41L13 16.17V4h-2z"/>
        </svg>
      </button>
    </div>

    <!-- Subtitles Line-by-Line List -->
    <div class="lines-container" id="lines-container">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">💬</div>
        <div class="empty-title">Субтитры пока не захвачены</div>
        <div class="empty-desc">Включите воспроизведение видео с субтитрами на текущей вкладке</div>
      </div>
    </div>

    <!-- Footer Actions -->
    <footer class="footer">
      <div class="footer-left">
        <button class="btn btn-secondary" id="btn-copy-all">Копировать</button>
        <button class="btn btn-secondary" id="btn-export-txt" title="Скачать текст (.txt)">TXT</button>
        <button class="btn btn-secondary" id="btn-export-srt" title="Скачать субтитры (.srt)">SRT</button>
      </div>
      <div class="footer-right">
        <button class="btn btn-danger" id="btn-clear">Очистить</button>
      </div>
    </footer>
  </div>

  <script src="modules/popup/exporter.js"></script>
  <script src="modules/popup/ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
